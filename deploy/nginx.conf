# 内网 Nginx 静态托管示例（dist 目录为站点根）
# 将 root 改为 dist 的绝对路径后 reload nginx

server {
    listen 80;
    server_name family-doctor-demo.local;

    root /path/to/familydoctor/miniapp/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
