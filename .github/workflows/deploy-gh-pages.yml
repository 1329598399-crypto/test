name: Build and Deploy to GitHub Pages
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 可选：让 Actions 的 JavaScript actions 立即使用 Node.js 24（避免未来弃用问题）
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 and print versions (debug)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: |
          echo "== node & npm versions =="
          node -v
          npm -v
          echo "=========================="

      - name: Install dependencies (try npm ci, fallback to npm install)
        run: |
          set -e
          echo "Trying npm ci..."
          if npm ci --no-audit --no-fund; then
            echo "npm ci succeeded"
          else
            echo "npm ci failed — falling back to npm install with legacy options"
            npm install --no-audit --no-fund --prefer-offline --legacy-peer-deps
          fi

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # publish_branch: gh-pages
