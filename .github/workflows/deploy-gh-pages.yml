name: Build and Deploy to GitHub Pages
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 强制 Actions 立即使用 Node.js 24（避免 Node 20 弃用问题）
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print Node / npm versions (debug)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: |
          echo "== node & npm versions =="
          node -v
          npm -v
          echo "=========================="

      - name: Install dependencies (try npm ci, fallback to npm install)
        # 先尝试干净安装（ci），若因 lockfile / npm 版本问题失败则回退到更宽容的 npm install
        run: |
          set -e
          echo "Trying npm ci..."
          if npm ci --no-audit --no-fund; then
            echo "npm ci succeeded"
          else
            echo "npm ci failed — falling back to npm install with legacy options"
            npm install --no-audit --no-fund --prefer-offline --legacy-peer-deps
          fi

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # 可选：指定发布分支（默认 gh-pages）
          # publish_branch: gh-pages
